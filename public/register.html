<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thế Giới Chat - Đăng ký thành viên</title>
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <div class="wap-wrapper">
    <!-- BANNER THƯƠNG HIỆU -->
    <header class="wap-banner">
      <div class="banner-title">THẾ GIỚI CHAT</div>
      <div class="banner-sub">
        <span class="c-blue">Wap chát</span> - <span class="c-yellow">Kết bạn</span> - <span class="c-green">Giải trí</span>
      </div>
    </header>

    <!-- THANH ĐIỀU HƯỚNG NHANH -->
    <nav class="wap-breadcrumb">
      🏠 <a href="/">Trang chủ</a> · <a href="/login">Đăng nhập</a> · <a href="/register" class="active-link">Đăng ký</a>
    </nav>

    <!-- THANH TIÊU ĐỀ MỤC -->
    <div class="section-bar">
      📝 Đăng ký tài khoản mới
    </div>

    <!-- KHUNG FORM ĐĂNG KÝ -->
    <main class="login-area">
      <div class="login-card">
        <div class="card-header">📝 Tạo tài khoản Thế Giới Chat</div>

        <form id="form-register" class="card-body" onsubmit="submitRegisterPage(event)">
          <div class="form-row">
            <label class="field-label">Tên hiển thị (Tiếng Việt có dấu):</label>
            <input type="text" id="reg-display-name" class="wap-input" required placeholder="Ví dụ: Hoàng Tử Bóng Đêm" />
          </div>
          <div class="form-row">
            <label class="field-label">Tên đăng nhập (viết liền không dấu):</label>
            <input type="text" id="reg-username" class="wap-input" required placeholder="Ví dụ: hoangtu" />
          </div>
          <div class="form-row">
            <label class="field-label">Mật khẩu:</label>
            <input type="password" id="reg-password" class="wap-input" required placeholder="Mật khẩu bảo mật..." />
          </div>

          <div id="reg-status-msg" class="status-msg hidden"></div>
          <button type="submit" id="btn-do-reg" class="btn-submit-blue" style="background-color: #15803d;">Tạo tài khoản mới (+1000 Xu)</button>

          <div class="divider-or"><span>Hoặc</span></div>
          <div class="register-prompt">
            <span class="c-green">Đã có tài khoản?</span> · <a href="/login" class="orange-link">Đăng nhập ngay</a>
          </div>
        </form>
      </div>
    </main>

    <!-- FOOTER -->
<footer class="wap-footer">
      <div class="footer-links">
        🏠 <a href="/">Trang chủ</a> · <a href="javascript:void(0)">Điều khoản</a> · <a href="javascript:void(0)">Liên hệ</a>
      </div>
      <div class="footer-info" style="text-align: center; padding: 8px; font-size: 11.5px; color: #6b7280;">
        Copyright © 2026 - Thế Giới Chat
      </div>
    </footer>
  </div>

  <script>
    async function submitRegisterPage(e) {
      e.preventDefault();
      const statusBox = document.getElementById('reg-status-msg');
      const btn = document.getElementById('btn-do-reg');
      statusBox.classList.add('hidden');

      const display_name = document.getElementById('reg-display-name').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;

      btn.disabled = true;
      btn.textContent = 'Đang khởi tạo...';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, display_name, password })
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          statusBox.textContent = data.error || 'Đăng ký thất bại!';
          statusBox.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Tạo tài khoản mới (+1000 Xu)';
          return;
        }
        alert(data.message + '\nBây giờ bạn sẽ được chuyển sang trang Đăng nhập.');
        window.location.href = '/login';
      } catch (err) {
        statusBox.textContent = 'Lỗi kết nối máy chủ!';
        statusBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Tạo tài khoản mới (+1000 Xu)';
      }
    }
  </script>
</body>
</html>
