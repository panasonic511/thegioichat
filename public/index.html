    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #050505; color: #e4e4e7; }
        .wap-card { background-color: #121214; border: 1px solid #27272a; }

<body class="font-sans min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

        <p class="text-[11px] mt-0.5 font-medium tracking-wide">

            <!-- Dynamic Nav -->
        </nav>
    </header>

    <!-- Khung nội dung chính -->
    <main id="main-content" class="max-w-md mx-auto w-full p-2.5 flex-grow space-y-3 my-1">
        <div class="text-center text-xs text-slate-500 py-8">Đang tải...</div>

        <p>© 2026 GAUBONG.US · All rights reserved</p>
    </footer>

    <!-- Nạp các tệp JS -->

    <script src="/js/home.js"></script>
    <script src="/js/posts.js"></script>
    <script src="/js/messages.js"></script>

    <script src="/js/admin.js"></script>
    <script src="/js/app.js"></script>
